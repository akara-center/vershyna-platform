<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Акаунт · Вершина 2.0</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/pilot.css">
</head>
<body>
  <header><div class="brand"><span>△</span> ВЕРШИНА 2.0</div><a id="tracker-link" href="/tracker" hidden>Відкрити трекер</a></header>
  <main>
    <h1>Мій акаунт</h1>
    <section class="card pilot-card">
      <form id="login" hidden>
        <label>Ключ доступу<input name="key" type="password" required minlength="43" maxlength="43"></label>
        <button>Увійти</button>
      </form>
      <div id="workspace" hidden>
        <p id="account-info"></p>
        <div class="pilot-actions">
          <a href="/coach" id="coach-link">Співпраця з коучем</a>
          <button type="button" id="reload">Оновити стан</button>
          <button type="button" id="download">Завантажити копію з акаунта</button>
          <button type="button" id="logout">Вийти</button>
        </div>
        <p>Робочий трекер синхронізується з акаунтом автоматично. Тут можна окремо завантажити резервну копію або перенести попередній прогрес з JSON.</p>
        <form id="upload">
          <label>Копія трекера<input name="file" type="file" accept=".json,application/json" required></label>
          <button>Зберегти копію в акаунті</button>
        </form>
      </div>
      <button type="button" id="blocked-logout" hidden>Вийти з акаунта</button>
      <section id="calendar-account" hidden>
        <h2>Google Calendar</h2>
        <p id="calendar-info" role="status"></p>
        <button type="button" id="calendar-connect">Під’єднати календар</button>
        <button type="button" id="calendar-disconnect" hidden>Від’єднати календар</button>
      </section>
      <p id="status" role="status"></p>
    </section>
  </main>
  <script src="/account.js" defer></script>
</body>
</html>
