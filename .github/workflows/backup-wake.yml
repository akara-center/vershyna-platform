name: Wake Vershyna for daily backup
on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake production service
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --max-time 15 https://vershyna-platform-production.up.railway.app/healthz
