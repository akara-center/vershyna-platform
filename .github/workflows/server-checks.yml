name: Server checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-syntax.cjs
      - run: node --test tests/*.test.cjs
      - name: Check deployment container
        run: |
          docker build --tag vershyna:checks .
          docker volume create vershyna-checks
          trap 'docker rm -f vershyna-checks; docker volume rm vershyna-checks' EXIT
          docker run --rm --mount source=vershyna-checks,target=/data vershyna:checks \
            node server/start.cjs provision ci-client client >/dev/null
          docker run --detach --name vershyna-checks --publish 127.0.0.1:18762:18762 \
            --mount source=vershyna-checks,target=/data --env RAILWAY_SERVICE_ID=ci \
            --env RAILWAY_VOLUME_MOUNT_PATH=/data --env RAILWAY_PUBLIC_DOMAIN=ci.example.invalid \
            --env PORT=18762 vershyna:checks
          if ! curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 1 \
            --max-time 2 http://127.0.0.1:18762/healthz; then
            docker logs vershyna-checks
            exit 1
          fi
          docker exec --user node vershyna-checks node -e \
            'const db = require("./server/workspaces.cjs").openWorkspaces("/data/vershyna.sqlite"); if (!db.prepare("SELECT id FROM workspace_accounts WHERE id = ?").get("ci-client")) process.exit(1); db.close();'
      - run: npm install --prefix "$RUNNER_TEMP/vershyna-browser" --no-package-lock playwright@1.56.1
      - name: Run browser scenarios
        run: |
          export VERSHYNA_PLAYWRIGHT="$RUNNER_TEMP/vershyna-browser/node_modules/playwright"
          if command -v google-chrome >/dev/null; then
            export VERSHYNA_CHROMIUM="$(command -v google-chrome)"
          else
            "$VERSHYNA_PLAYWRIGHT/cli.js" install --with-deps chromium
          fi
          node scripts/check-browser.cjs
