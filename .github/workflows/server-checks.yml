name: Server checks
on:
  push:
    branches: [main, vershyna/hosting-prep]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-server:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-syntax.cjs
      - run: node --test tests/*.test.cjs
      - run: npm install --prefix "$RUNNER_TEMP/vershyna-browser" --no-package-lock playwright@1.56.1
      - run: |
          "$RUNNER_TEMP/vershyna-browser/node_modules/.bin/playwright" install --with-deps chromium
      - run: VERSHYNA_PLAYWRIGHT="$RUNNER_TEMP/vershyna-browser/node_modules/playwright" node scripts/check-browser.cjs
